<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D98A"/>
      <stop offset="50%" stop-color="#C9942A"/>
      <stop offset="100%" stop-color="#8A6416"/>
    </linearGradient>

    <radialGradient id="bg" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#FFFDF8"/>
      <stop offset="100%" stop-color="#F5E9D0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)"/>

  <!-- Gold Ring -->
  <circle cx="32" cy="32" r="28"
          fill="none"
          stroke="url(#gold)"
          stroke-width="2"/>

  <!-- OM -->
  <text x="32"
        y="41"
        text-anchor="middle"
        font-size="34"
        font-family="Noto Serif Devanagari, serif"
        fill="url(#gold)">
        ॐ
  </text>
</svg>