kind = "web"
previewPath = "/"
title = "Mim's Cake by World"
description = "A premium, responsive one-page website for Mim's Cake by World, a homemade cake and dessert business in Rangpur, Bangladesh, with direct WhatsApp ordering and a warm editorial brand presentation."
version = "1.0.0"
id = "artifacts/mims-cake-by-world"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19422

[services.development]
run = "pnpm --filter @workspace/mims-cake-by-world run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mims-cake-by-world", "run", "build" ]
serve = "static"
publicDir = "artifacts/mims-cake-by-world/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19422"
BASE_PATH = "/"
